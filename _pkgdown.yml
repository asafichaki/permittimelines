url: https://asafichaki.github.io/permittimelines/

template:
  bootstrap: 5
  includes:
    in_header: |
      <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Dataset",
        "name": "Garage-Conversion and ADU Building Permit Timelines for Four U.S. Cities",
        "description": "64,427 residential garage-conversion and ADU permit applications for Los Angeles, San Diego, San Francisco, and Seattle, with measured application-to-issuance waits, application-year cohort completion rates, and small-cell-suppressed timeline aggregates. Prepared from each city's official open-data portal with a committed, dependency-free build script.",
        "url": "https://asafichaki.github.io/permittimelines/",
        "sameAs": [
          "https://github.com/asafichaki/permittimelines",
          "https://www.therenology.com/tools/permit-timeline"
        ],
        "version": "2026.1",
        "dateModified": "2026-08-24",
        "license": "https://creativecommons.org/licenses/by/4.0/",
        "creator": {
          "@type": "Person",
          "name": "Assaf Ichaki"
        },
        "publisher": {
          "@type": "Organization",
          "name": "Renology",
          "url": "https://www.therenology.com/"
        },
        "keywords": ["building permits", "permit timeline", "accessory dwelling unit", "ADU", "garage conversion", "open government data", "housing"],
        "spatialCoverage": ["Los Angeles, CA", "San Diego, CA", "San Francisco, CA", "Seattle, WA"],
        "temporalCoverage": "2014-01-01/2026-08-24",
        "isBasedOn": [
          "https://data.lacity.org/d/pi9x-tg5x",
          "https://data.lacity.org/d/gwh9-jnip",
          "https://data.sandiego.gov/datasets/development-permits-set1/",
          "https://data.sfgov.org/d/i98e-djp9",
          "https://data.seattle.gov/d/76t5-zqzr"
        ],
        "distribution": [
          {
            "@type": "DataDownload",
            "name": "permit-records.csv.gz",
            "encodingFormat": "text/csv",
            "contentUrl": "https://raw.githubusercontent.com/asafichaki/permittimelines/main/inst/extdata/permit-records.csv.gz"
          },
          {
            "@type": "DataDownload",
            "name": "permit-cohorts.csv",
            "encodingFormat": "text/csv",
            "contentUrl": "https://raw.githubusercontent.com/asafichaki/permittimelines/main/inst/extdata/permit-cohorts.csv"
          },
          {
            "@type": "DataDownload",
            "name": "permit-timelines.csv",
            "encodingFormat": "text/csv",
            "contentUrl": "https://raw.githubusercontent.com/asafichaki/permittimelines/main/inst/extdata/permit-timelines.csv"
          }
        ]
      }
      </script>

home:
  title: Garage-conversion and ADU permit timeline data for R
  description: >
    Reproducible access to prepared building-permit records measuring how
    long residential garage-to-ADU conversions waited between application
    and issuance in Los Angeles, San Diego, San Francisco, and Seattle.

reference:
  - title: Package
    contents:
      - permittimelines-package
  - title: Datasets
    contents:
      - permit_records
      - permit_cohorts
      - permit_timelines
      - permit_metadata

footer:
  structure:
    left: developed_by
    right: built_with
